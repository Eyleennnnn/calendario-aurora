<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendario Aurora</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Arial", sans-serif;
  background: linear-gradient(135deg, #080b2b, #17145c, #302477);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
  color: white;
}

.calendar {
  width: 100%;
  max-width: 900px;
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 28px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.title {
  text-align: center;
  flex: 1;
}

.title h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
}

.title p {
  margin: 7px 0 0;
  opacity: .75;
  font-size: 14px;
}

button {
  border: none;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 20px;
  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: rgba(255,255,255,0.30);
  transform: scale(1.08);
}

.weekdays,
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.weekdays div {
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  opacity: .7;
  padding: 10px 0;
}

.day {
  min-height: 85px;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  padding: 10px;
  cursor: pointer;
  transition: .25s;
  position: relative;
}

.day:hover {
  background: rgba(255,255,255,0.18);
  transform: translateY(-2px);
}

.day-number {
  font-weight: bold;
  font-size: 14px;
}

.today {
  border: 2px solid #c9b6ff;
  box-shadow: 0 0 15px rgba(201,182,255,.35);
}

.event {
  margin-top: 9px;
  padding: 5px 7px;
  border-radius: 8px;
  background: rgba(201,182,255,.30);
  font-size: 10px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.empty {
  background: transparent;
  cursor: default;
}

@media(max-width:600px) {

  body {
    padding: 10px;
  }

  .calendar {
    padding: 15px;
    border-radius: 20px;
  }

  .title h1 {
    font-size: 21px;
  }

  .day {
    min-height: 55px;
    padding: 6px;
  }

  .event {
    display: none;
  }

  .weekdays div {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="calendar">

  <div class="header">

    <button onclick="previousMonth()">‹</button>

    <div class="title">
      <h1>✦ AURORA ✦</h1>
      <p id="monthYear"></p>
    </div>

    <button onclick="nextMonth()">›</button>

  </div>

  <div class="weekdays">
    <div>LUN</div>
    <div>MAR</div>
    <div>MIÉ</div>
    <div>JUE</div>
    <div>VIE</div>
    <div>SÁB</div>
    <div>DOM</div>
  </div>

  <div class="days" id="calendarDays"></div>

</div>

<script>

let currentDate = new Date();

const events = {
  // Ejemplo:
  // "2026-09-28": "Presentación",
  // "2026-10-05": "Entrega"
};

const monthNames = [
  "Enero",
  "Febrero",
  "Marzo",
  "Abril",
  "Mayo",
  "Junio",
  "Julio",
  "Agosto",
  "Septiembre",
  "Octubre",
  "Noviembre",
  "Diciembre"
];

function renderCalendar() {

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("monthYear").textContent =
    monthNames[month] + " " + year;

  const calendarDays =
    document.getElementById("calendarDays");

  calendarDays.innerHTML = "";

  let firstDay = new Date(year, month, 1).getDay();

  // Convertir domingo=0 a lunes=0
  firstDay = firstDay === 0 ? 6 : firstDay - 1;

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  // Espacios antes del primer día
  for (let i = 0; i < firstDay; i++) {

    const empty = document.createElement("div");

    empty.className = "day empty";

    calendarDays.appendChild(empty);
  }

  // Crear días
  for (let day = 1; day <= daysInMonth; day++) {

    const dayElement = document.createElement("div");

    dayElement.className = "day";

    const number = document.createElement("div");

    number.className = "day-number";

    number.textContent = day;

    dayElement.appendChild(number);

    // Fecha completa
    const dateKey =
      year + "-" +
      String(month + 1).padStart(2, "0") + "-" +
      String(day).padStart(2, "0");

    // Marcar día actual
    const today = new Date();

    if (
      day === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear()
    ) {

      dayElement.classList.add("today");
    }

    // Mostrar evento
    if (events[dateKey]) {

      const event = document.createElement("div");

      event.className = "event";

      event.textContent = events[dateKey];

      dayElement.appendChild(event);
    }

    calendarDays.appendChild(dayElement);
  }
}

function previousMonth() {

  currentDate.setMonth(currentDate.getMonth() - 1);

  renderCalendar();
}

function nextMonth() {

  currentDate.setMonth(currentDate.getMonth() + 1);

  renderCalendar();
}

renderCalendar();

</script>

</body>
</html>
